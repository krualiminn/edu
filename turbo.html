<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOBO Quiz - Multiplayer EdTech</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Kanit', sans-serif; overflow-x: hidden; background-color: #f8fafc; touch-action: manipulation; }
        
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float 6s ease-in-out infinite; animation-delay: 3s; }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); } 
            50% { transform: translateY(-20px) rotate(10deg); } 
            100% { transform: translateY(0px) rotate(0deg); } 
        }

        .animate-pulse-fast { animation: pulseFast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulseFast { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        /* 3D Button Styles */
        .btn-3d { box-shadow: 0 8px 0 rgba(0,0,0,0.2); transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-3d:active { box-shadow: 0 0px 0 rgba(0,0,0,0.2); transform: translateY(8px); }
        .btn-3d:disabled { opacity: 0.7; box-shadow: 0 0px 0 rgba(0,0,0,0.2); transform: translateY(8px); cursor: not-allowed; }
        
        .btn-3d-emerald { background-color: #10b981; box-shadow: 0 8px 0 #047857; color: white; }
        .btn-3d-emerald:active { box-shadow: 0 0px 0 #047857; transform: translateY(8px); }
        .btn-3d-blue { background-color: #3b82f6; box-shadow: 0 8px 0 #1d4ed8; color: white; }
        .btn-3d-blue:active { box-shadow: 0 0px 0 #1d4ed8; transform: translateY(8px); }
        .btn-3d-slate { background-color: #334155; box-shadow: 0 8px 0 #0f172a; color: white; }
        .btn-3d-slate:active { box-shadow: 0 0px 0 #0f172a; transform: translateY(8px); }
        
        /* Shape Button Colors (Kahoot style) */
        .btn-shape-0 { background-color: #e21b3c; box-shadow: 0 8px 0 #8b0f24; }
        .btn-shape-1 { background-color: #1368ce; box-shadow: 0 8px 0 #0b3d7a; }
        .btn-shape-2 { background-color: #d89e00; box-shadow: 0 8px 0 #876200; }
        .btn-shape-3 { background-color: #26890c; box-shadow: 0 8px 0 #154c06; }
        
        .btn-shape-0:active { box-shadow: 0 0px 0 #8b0f24; transform: translateY(8px); }
        .btn-shape-1:active { box-shadow: 0 0px 0 #0b3d7a; transform: translateY(8px); }
        .btn-shape-2:active { box-shadow: 0 0px 0 #876200; transform: translateY(8px); }
        .btn-shape-3:active { box-shadow: 0 0px 0 #154c06; transform: translateY(8px); }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-300">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provide Fallbacks for standalone HTML running outside the specific artifact environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tobo-quiz-multiplayer-v1';
        let firebaseConfig = { apiKey: "dummy", authDomain: "dummy", projectId: "dummy" };
        
        try {
            if (typeof __firebase_config !== 'undefined') {
                // รองรับทั้งกรณีที่ config เป็น String และ Object
                firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            }
        } catch (e) { 
            console.warn("Firebase config parsing failed:", e); 
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose to window for React code
        window.fb = {
            appId, auth, db, signInAnonymously, signInWithCustomToken,
            doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc,
            initialToken: typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null
        };
        
        // แจ้งเตือนเมื่อ Firebase พร้อมใช้งาน
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        //        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, type, duration) => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        };

        const Sounds = {
            tick: () => playTone(800, 'square', 0.05),
            start: () => { playTone(440, 'sine', 0.1); setTimeout(()=>playTone(554, 'sine', 0.2), 100); setTimeout(()=>playTone(659, 'sine', 0.3), 200); },
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); setTimeout(()=>playTone(783.99, 'sine', 0.4), 200); },
            wrong: () => { playTone(300, 'sawtooth', 0.3); setTimeout(()=>playTone(250, 'sawtooth', 0.4), 200); },
            fanfare: () => { playTone(523, 'square', 0.2); setTimeout(()=>playTone(523, 'square', 0.2), 200); setTimeout(()=>playTone(783, 'square', 0.6), 400); },
            pop: () => playTone(600, 'sine', 0.05)
        };

        const ShapeIcon = ({ index, className = "w-16 h-16 text-white" }) => {
            const shapes = [
                <polygon points="12 2 22 20 2 20" fill="currentColor"/>, // Triangle
                <polygon points="12 2 22 12 12 22 2 12" fill="currentColor"/>, // Diamond
                <circle cx="12" cy="12" r="10" fill="currentColor"/>, // Circle
                <rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/> // Square
            ];
            return <svg viewBox="0 0 24 24" className={className}>{shapes[index]}</svg>;
        };

        const BTN_CLASSES = ['btn-shape-0', 'btn-shape-1', 'btn-shape-2', 'btn-shape-3'];
        const BG_COLORS = ['bg-[#e21b3c]', 'bg-[#1368ce]', 'bg-[#d89e00]', 'bg-[#26890c]'];

        const generateRoomCode = () => Math.floor(100000 + Math.random() * 900000).toString();

        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [view, setView] = useState('home'); // home, host_setup, host_game, player_join, player_game
            const [roomCode, setRoomCode] = useState('');
            const [playerName, setPlayerName] = useState('');

            const showError = (msg) => { setErrorMsg(msg); setTimeout(() => setErrorMsg(''), 6000); };

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.fb) return;
                    try {
                        if (window.fb.initialToken) {
                            try {
                                await window.fb.signInWithCustomToken(window.fb.auth, window.fb.initialToken);
                            } catch (tokenErr) {
                                console.warn("Custom token failed, trying anonymous auth...", tokenErr);
                                await window.fb.signInAnonymously(window.fb.auth);
                            }
                        } else {
                            await window.fb.signInAnonymously(window.fb.auth);
                        }
                        setUser(window.fb.auth.currentUser);
                    } catch (err) {
                        console.error("Auth error:", err);
                        setAuthError("เชื่อมต่อระบบไม่สำเร็จ: " + err.message);
                    }
                };

                // ตรวจสอบว่า Firebase โหลดเสร็จหรือยัง
                if (window.fb) {
                    initAuth();
                } else {
                    window.addEventListener('firebase-ready', initAuth);
                    return () => window.removeEventListener('firebase-ready', initAuth);
                }
            }, []);

            if (authError) return <div className="flex h-screen items-center justify-center text-rose-500 font-bold p-8 text-center">{authError}</div>;
            if (!user) return <div className="flex flex-col h-screen items-center justify-center bg-slate-900 text-white"><div className="loader mb-4"></div><div>กำลังเชื่อมต่อเซิร์ฟเวอร์...</div></div>;

            const leaveRoom = async () => {
                setView('home');
                setRoomCode('');
            };

            return (
                <div className="min-h-screen flex flex-col font-['Kanit'] overflow-hidden relative">
                    {errorMsg && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-4 rounded-full shadow-2xl z-50 animate-fade-in-up border-2 border-red-400 flex items-center font-bold text-lg w-11/12 max-w-lg">
                            <i className="fa-solid fa-circle-exclamation mr-3 text-2xl"></i> 
                            <div>{errorMsg}</div>
                        </div>
                    )}
                    
                    {view === 'home' && <RoleSelection setView={setView} />}
                    {view === 'host_setup' && <HostSetup setView={setView} setRoomCode={setRoomCode} showError={showError} userId={user.uid} />}
                    {view === 'host_game' && <HostGame roomCode={roomCode} setView={setView} userId={user.uid} showError={showError} leaveRoom={leaveRoom} />}
                    
                    {view === 'player_join' && <PlayerJoin setView={setView} setRoomCode={setRoomCode} setPlayerName={setPlayerName} userId={user.uid} showError={showError} goHome={leaveRoom} />}
                    {view === 'player_game' && <PlayerGame roomCode={roomCode} playerName={playerName} userId={user.uid} showError={showError} leaveRoom={leaveRoom} />}
                </div>
            );
        }

        function RoleSelection({ setView }) {
            return (
                <div className="flex-1 flex flex-col md:flex-row bg-slate-900 text-white">
                    <div className="flex-1 flex flex-col items-center justify-center p-8 md:p-16 relative overflow-hidden bg-gradient-to-br from-indigo-900 to-purple-900 border-r border-white/10">
                        <div className="absolute top-10 left-10 text-yellow-300 opacity-20 animate-float"><ShapeIcon index={0} className="w-32 h-32" /></div>
                        <div className="absolute bottom-10 right-10 text-emerald-300 opacity-20 animate-float-delayed"><ShapeIcon index={2} className="w-40 h-40" /></div>
                        
                        <div className="z-10 text-center">
                            <div className="inline-block bg-white/20 px-4 py-1 rounded-full font-bold text-sm mb-4 backdrop-blur-sm uppercase tracking-widest text-yellow-200">
                                Multiplayer EdTech
                            </div>
                            <h1 className="text-6xl md:text-8xl font-black mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-sm">
                                TOBO <span className="text-white">Quiz</span>
                            </h1>
                            <p className="text-xl md:text-2xl text-purple-200 font-medium mb-12">
                                เปลี่ยนห้องเรียนให้สนุก เหมือนเล่นเกมโชว์!
                            </p>
                            <div className="bg-black/30 p-6 rounded-3xl backdrop-blur-sm border border-white/10 inline-block text-left">
                                <div className="text-sm text-yellow-300 font-bold uppercase tracking-widest mb-2">พัฒนาโดย</div>
                                <div className="text-lg font-bold"><i className="fa-solid fa-chalkboard-user mr-2 text-indigo-400"></i> ครูมิน อลีมิน เจ๊ะอีซอ <span className="text-slate-400 text-sm ml-2">โรงเรียนบ้านเจ๊ะยอ</span></div>
                                <div className="text-lg font-bold mt-1"><i className="fa-solid fa-chalkboard-user mr-2 text-indigo-400"></i> ครูยี แวอัสรี แวมายิ <span className="text-slate-400 text-sm ml-2">โรงเรียนบ้านปูโป๊ะ</span></div>
                            </div>
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center p-8 bg-slate-100 text-slate-800">
                        <h2 className="text-3xl font-black mb-8 text-slate-700">เลือกบทบาทของคุณ</h2>
                        <div className="w-full max-w-md space-y-6">
                            <button onClick={() => setView('player_join')} className="w-full btn-3d-blue rounded-3xl p-8 flex items-center justify-between group">
                                <div className="text-left">
                                    <div className="text-3xl font-black mb-1">เข้าร่วมเกม</div>
                                    <div className="text-blue-100 font-medium">สำหรับนักเรียน (ผู้เล่น)</div>
                                </div>
                                <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <i className="fa-solid fa-gamepad text-3xl text-white"></i>
                                </div>
                            </button>
                            
                            <button onClick={() => setView('host_setup')} className="w-full btn-3d-emerald rounded-3xl p-8 flex items-center justify-between group">
                                <div className="text-left">
                                    <div className="text-3xl font-black mb-1">สร้างห้องเกม</div>
                                    <div className="text-emerald-100 font-medium">สำหรับคุณครู (Host)</div>
                                </div>
                                <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <i className="fa-solid fa-chalkboard text-3xl text-white"></i>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function HostSetup({ setView, setRoomCode, showError, userId }) {
            const [topic, setTopic] = useState('');
            const [grade, setGrade] = useState('ป.4');
            const [count, setCount] = useState(5);
            const [timeLimit, setTimeLimit] = useState(20);
            const [apiKey, setApiKey] = useState('');
            const [loading, setLoading] = useState(false);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                const savedKey = localStorage.getItem('gemini_api_key');
                if (savedKey) setApiKey(savedKey);
            }, []);

            const generateQuestionsWithGemini = async () => {
                const prompt = `สร้างชุดคำถามปรนัย (Multiple Choice) ภาษาไทย
หัวข้อ: ${topic}
ระดับชั้น: ${grade}
จำนวน: ${count} ข้อ

ส่งกลับเฉพาะ JSON Array เท่านั้น ห้ามมีคำอธิบายอื่น ห้ามมี markdown (เช่น \`\`\`json)
รูปแบบ JSON ที่ต้องการ:
[
  {
    "question": "คำถาม?",
    "options": ["ตัวเลือก 1", "ตัวเลือก 2", "ตัวเลือก 3", "ตัวเลือก 4"],
    "correctIndex": 0,
    "explanation": "คำอธิบายสั้นๆ ว่าทำไมข้อนี้ถึงถูก"
  }
]`;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey.trim()}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(`API Error: ${response.status} - ${errData.error?.message || 'ไม่สามารถติดต่อ Google Gemini ได้'}`);
                }

                const result = await response.json();
                let jsonString = result.candidates[0]?.content?.parts[0]?.text;
                if (!jsonString) throw new Error("AI ไม่ได้ส่งข้อมูลกลับมา");

                jsonString = jsonString.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsedData = JSON.parse(jsonString);
                if (!Array.isArray(parsedData) || parsedData.length === 0) throw new Error("รูปแบบข้อมูลผิดพลาด");
                return parsedData;
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                if(!topic) return showError("กรุณาระบุหัวข้อครับ");
                if(!apiKey) {
                    setShowSettings(true);
                    return showError("กรุณาใส่ Gemini API Key ในการตั้งค่าก่อนครับ");
                }
                
                setLoading(true);
                try {
                    localStorage.setItem('gemini_api_key', apiKey.trim());
                    const questions = await generateQuestionsWithGemini();
                    
                    const code = generateRoomCode();
                    const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', code);
                    
                    await window.fb.setDoc(roomRef, {
                        hostId: userId,
                        status: 'lobby',
                        gameData: { topic, gradeLevel: grade, timeLimit: Number(timeLimit), questions },
                        currentIdx: 0,
                        players: {},
                        createdAt: Date.now()
                    });

                    setRoomCode(code);
                    setView('host_game');
                    Sounds.pop();
                } catch(err) { 
                    console.error(err);
                    showError(err.message); 
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative">
                    <button onClick={() => setView('home')} className="absolute top-6 left-6 z-30 bg-white shadow-md text-slate-600 hover:text-indigo-600 rounded-full w-12 h-12 flex items-center justify-center transition-all">
                        <i className="fa-solid fa-arrow-left text-xl"></i>
                    </button>
                    
                    <button onClick={() => setShowSettings(true)} className="absolute top-6 right-6 z-30 bg-white shadow-md text-slate-600 hover:text-indigo-600 rounded-full w-12 h-12 flex items-center justify-center transition-all">
                        <i className="fa-solid fa-gear text-xl"></i>
                    </button>

                    {showSettings && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in-up">
                            <div className="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl relative border-2 border-slate-100">
                                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-slate-400 hover:text-rose-500 transition-colors w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 hover:bg-rose-100">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                                <div className="text-center mb-6 mt-2">
                                    <div className="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4"><i className="fa-solid fa-key text-3xl"></i></div>
                                    <h3 className="text-2xl font-black text-slate-800">การเชื่อมต่อ AI</h3>
                                    <p className="text-slate-500 mt-2 text-sm">ใส่ Gemini API Key ของคุณที่นี่ (aistudio.google.com)</p>
                                </div>
                                <input type="password" placeholder="AIzaSy..." value={apiKey} onChange={(e)=>setApiKey(e.target.value)} className="w-full text-center text-lg p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none mb-4 tracking-widest" />
                                <button onClick={() => { localStorage.setItem('gemini_api_key', apiKey.trim()); setShowSettings(false); }} className="w-full btn-3d-slate rounded-xl p-4 text-xl font-black">บันทึกข้อมูล</button>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-[3rem] p-8 md:p-12 shadow-2xl border-4 border-slate-100 w-full max-w-lg">
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-16 text-indigo-600 animate-pulse">
                                <i className="fa-solid fa-wand-magic-sparkles text-7xl mb-6"></i>
                                <h2 className="text-3xl font-black text-center">AI กำลังแต่งคำถาม...</h2>
                                <span className="text-slate-500 font-medium mt-4 bg-slate-100 px-4 py-2 rounded-full">รอสักครู่ ประมาณ 10-15 วินาที</span>
                            </div>
                        ) : (
                            <form onSubmit={handleCreate} className="space-y-5 animate-fade-in-up">
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-black text-slate-800">สร้างห้องเกม (Host)</h2>
                                    <p className="text-slate-500 font-medium mt-1">ให้ AI ช่วยสร้างโจทย์ให้ในพริบตา</p>
                                </div>
                                <div>
                                    <label className="block text-slate-600 font-bold mb-2 text-sm">หัวข้อเรื่อง / รายวิชา</label>
                                    <input type="text" placeholder="เช่น สัตว์น่ารู้, ประวัติศาสตร์" value={topic} onChange={(e)=>setTopic(e.target.value)} className="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:bg-white focus:outline-none transition-all" required />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-slate-600 font-bold mb-2 text-sm">ระดับชั้น</label>
                                        <select value={grade} onChange={(e)=>setGrade(e.target.value)} className="w-full text-lg font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:outline-none cursor-pointer">
                                            {['ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'].map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-600 font-bold mb-2 text-sm">จำนวนข้อ</label>
                                        <input type="number" value={count} onChange={(e)=>setCount(e.target.value)} min="1" max="20" className="w-full text-lg font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:outline-none" required />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-slate-600 font-bold mb-2 text-sm">เวลาต่อข้อ (วินาที)</label>
                                    <select value={timeLimit} onChange={(e)=>setTimeLimit(e.target.value)} className="w-full text-lg font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:outline-none cursor-pointer">
                                        <option value="10">10 วินาที</option>
                                        <option value="20">20 วินาที</option>
                                        <option value="30">30 วินาที</option>
                                        <option value="60">60 วินาที</option>
                                    </select>
                                </div>
                                <button type="submit" className="w-full btn-3d-emerald rounded-2xl p-5 text-2xl font-black mt-4 flex items-center justify-center">
                                    สร้างห้องทันที <i className="fa-solid fa-bolt ml-3 text-yellow-300"></i>
                                </button>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        function PlayerJoin({ setView, setRoomCode, setPlayerName, userId, showError, goHome }) {
            const [inputPin, setInputPin] = useState('');
            const [inputName, setInputName] = useState('');
            const [loading, setLoading] = useState(false);

            const handleJoin = async (e) => {
                e.preventDefault();
                if(inputPin.length !== 6) return showError("PIN ต้องมี 6 หลัก");
                if(inputName.trim().length < 2) return showError("ชื่อต้องมีอย่างน้อย 2 ตัวอักษร");
                
                setLoading(true);
                try {
                    const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', inputPin);
                    const docSnap = await window.fb.getDoc(roomRef);
                    
                    if (!docSnap.exists()) {
                        setLoading(false);
                        return showError("ไม่พบห้องเกมนี้ กรุณาตรวจสอบ PIN");
                    }
                    
                    const roomData = docSnap.data();
                    if (roomData.status !== 'lobby') {
                        setLoading(false);
                        return showError("เกมเริ่มไปแล้ว ไม่สามารถเข้าได้");
                    }

                    // Register player in room document
                    await window.fb.updateDoc(roomRef, {
                        [`players.${userId}`]: {
                            name: inputName.trim(),
                            score: 0,
                            answers: {}
                        }
                    });

                    setRoomCode(inputPin);
                    setPlayerName(inputName.trim());
                    setView('player_game');
                    Sounds.pop();
                } catch(err) {
                    console.error(err);
                    showError("เกิดข้อผิดพลาดในการเข้าร่วม");
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-indigo-600 flex items-center justify-center p-4 relative overflow-hidden">
                    {/* Background shapes */}
                    <div className="absolute top-10 left-10 opacity-10 animate-float"><ShapeIcon index={0} className="w-32 h-32" /></div>
                    <div className="absolute bottom-10 right-10 opacity-10 animate-float-delayed"><ShapeIcon index={3} className="w-40 h-40" /></div>
                    
                    <button onClick={goHome} className="absolute top-6 left-6 z-30 bg-white/20 hover:bg-white/40 text-white rounded-full w-12 h-12 flex items-center justify-center transition-all backdrop-blur-sm">
                        <i className="fa-solid fa-arrow-left text-xl"></i>
                    </button>

                    <div className="bg-white rounded-[3rem] p-8 md:p-12 shadow-2xl w-full max-w-sm z-10 animate-fade-in-up">
                        <div className="text-center mb-8">
                            <h2 className="text-4xl font-black text-slate-800 mb-2">เข้าร่วมเกม</h2>
                            <p className="text-slate-500 font-medium">ดู PIN จากหน้าจอคุณครู</p>
                        </div>
                        <form onSubmit={handleJoin} className="space-y-4">
                            <div>
                                <input type="number" placeholder="Game PIN" value={inputPin} onChange={(e)=>setInputPin(e.target.value.slice(0,6))} className="w-full text-center text-3xl font-black p-4 bg-slate-100 border-4 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white focus:outline-none transition-all tracking-[0.2em]" required />
                            </div>
                            <div>
                                <input type="text" placeholder="ชื่อของคุณ" value={inputName} onChange={(e)=>setInputName(e.target.value)} className="w-full text-center text-xl font-bold p-4 bg-slate-100 border-4 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white focus:outline-none transition-all" required maxLength="15" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full btn-3d-blue rounded-2xl p-5 text-2xl font-black mt-2 flex items-center justify-center">
                                {loading ? <div className="loader border-t-white w-6 h-6 border-2"></div> : 'เข้าเล่นเลย!'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function HostGame({ roomCode, setView, userId, showError, leaveRoom }) {
            const [room, setRoom] = useState(null);
            const [timeLeft, setTimeLeft] = useState(0);

            // Listen to room document
            useEffect(() => {
                const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                const unsubscribe = window.fb.onSnapshot(roomRef, (doc) => {
                    if (doc.exists()) {
                        setRoom(doc.data());
                    } else {
                        showError("ห้องถูกปิดแล้ว");
                        leaveRoom();
                    }
                }, (error) => {
                    console.error(error);
                    showError("หลุดการเชื่อมต่อ");
                });
                return () => unsubscribe();
            }, [roomCode]);

            // Host Timer Logic
            useEffect(() => {
                if (!room || room.status !== 'question') return;
                
                const updateTimer = () => {
                    const elapsed = Math.floor((Date.now() - room.questionStartTime) / 1000);
                    const remaining = Math.max(0, room.gameData.timeLimit - elapsed);
                    setTimeLeft(remaining);
                    
                    if (remaining <= 5 && remaining > 0) Sounds.tick();
                    
                    if (remaining === 0) {
                        handleTimeOut();
                    }
                };

                updateTimer(); // Initial call
                const timer = setInterval(updateTimer, 1000);
                return () => clearInterval(timer);
            }, [room?.status, room?.questionStartTime]);

            const updateRoomStatus = async (updates) => {
                const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                await window.fb.updateDoc(roomRef, updates);
            };

            const startGame = () => {
                Sounds.start();
                updateRoomStatus({
                    status: 'question',
                    currentIdx: 0,
                    questionStartTime: Date.now()
                });
            };

            const handleTimeOut = () => {
                Sounds.wrong();
                updateRoomStatus({ status: 'reveal' });
            };

            const handleSkipToReveal = () => {
                updateRoomStatus({ status: 'reveal' });
            };

            const handleShowLeaderboard = () => {
                updateRoomStatus({ status: 'leaderboard' });
            };

            const handleNextQuestion = () => {
                if (room.currentIdx >= room.gameData.questions.length - 1) {
                    Sounds.fanfare();
                    updateRoomStatus({ status: 'summary' });
                } else {
                    updateRoomStatus({
                        status: 'question',
                        currentIdx: room.currentIdx + 1,
                        questionStartTime: Date.now()
                    });
                }
            };

            const handleCloseRoom = async () => {
                if(confirm("ต้องการปิดห้องและจบเกมใช่หรือไม่?")) {
                    const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                    await window.fb.deleteDoc(roomRef);
                    leaveRoom();
                }
            };

            if (!room) return <div className="flex h-screen items-center justify-center bg-slate-100"><div className="loader"></div></div>;

            const playersList = Object.values(room.players || {});
            const playerCount = playersList.length;

            // --- LOBBY VIEW ---
            if (room.status === 'lobby') {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col relative">
                        <button onClick={handleCloseRoom} className="absolute top-6 left-6 z-30 bg-white hover:bg-red-50 text-slate-500 hover:text-red-500 px-6 py-3 rounded-full font-bold shadow-sm transition-colors">

                        </button>

                                <div className="text-slate-500 font-bold text-2xl uppercase tracking-widest mb-2">Game PIN</div>
                                <div className="text-[8rem] font-black text-slate-800 leading-none tracking-[0.2em]">{roomCode}</div>
                                <div className="mt-4 text-indigo-600 font-bold text-xl">เข้าเว็บนี้ในมือถือเพื่อร่วมสนุก!</div>
                            </div>

                                <div className="flex justify-between items-end mb-4 px-4">
                                    <h3 className="text-3xl font-black text-slate-700">ผู้เล่นเตรียมพร้อม <span className="text-indigo-600 bg-indigo-100 px-4 py-1 rounded-full">{playerCount}</span></h3>
                                    {playerCount > 0 && (
                                        <button onClick={startGame} className="btn-3d-emerald px-10 py-4 rounded-full text-2xl font-black animate-pulse-fast">
                                            เริ่มเกม <i className="fa-solid fa-play ml-2"></i>
                                        </button>
                                    )}
                                </div>
                                <div className="bg-white rounded-3xl p-8 min-h-[300px] shadow-inner flex flex-wrap content-start gap-4 border-2 border-slate-200">
                                    {playersList.length === 0 ? (
                                        <div className="w-full text-center text-slate-400 font-medium text-2xl py-20">รอผู้เล่นเข้าห้อง...</div>
                                    ) : (
                                        playersList.map((p, i) => (
                                            <div key={i} className="bg-indigo-50 text-indigo-800 font-bold text-xl px-6 py-3 rounded-full border border-indigo-100 animate-fade-in-up" style={{animationDelay: `${(i%10)*0.1}s`}}>
                                                {p.name}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- IN-GAME VARIABLES ---
            const currentQ = room.gameData.questions[room.currentIdx];
            const isLast = room.currentIdx >= room.gameData.questions.length - 1;
            
            // Calculate answers stats for Reveal view
            let answerStats = [0,0,0,0];
            let totalAnswers = 0;
            if (room.status === 'reveal') {
                Object.values(room.players || {}).forEach(p => {
                    const ans = p.answers?.[room.currentIdx]?.selectedIdx;
                    if (ans !== undefined && ans >= 0 && ans <= 3) {
                        answerStats[ans]++;
                        totalAnswers++;
                    }
                });
            }

            // Calculate Leaderboard
            const sortedPlayers = [...playersList].sort((a,b) => (b.score || 0) - (a.score || 0));
            const topPlayers = sortedPlayers.slice(0, 5);

            // --- HOST VIEWS (Question / Reveal / Leaderboard / Summary) ---
            return (
                <div className="min-h-screen flex flex-col bg-slate-100 p-8 relative">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6">
                        <div className="bg-white px-8 py-3 rounded-2xl font-black text-2xl shadow-sm border-2 border-slate-200 text-indigo-600">
                            ข้อ {room.currentIdx + 1} <span className="text-slate-400 font-medium mx-2">/</span> {room.gameData.questions.length}
                        </div>
                        <div className="bg-white px-8 py-3 rounded-2xl font-black text-2xl shadow-sm border-2 border-slate-200 text-slate-600">
                            PIN: {roomCode}
                        </div>
                        {room.status === 'question' && (
                            <div className="flex items-center space-x-6">
                                <div className="text-xl font-bold text-slate-500 bg-white px-6 py-3 rounded-2xl border-2 border-slate-200">
                                    ตอบแล้ว: {Object.values(room.players || {}).filter(p => p.answers && p.answers[room.currentIdx] !== undefined).length} / {playerCount}
                                </div>
                                <div className={`w-24 h-24 rounded-full flex items-center justify-center text-5xl font-black shadow-lg border-4 ${timeLeft <= 5 ? 'bg-red-500 border-red-200 animate-pulse text-white' : 'bg-indigo-600 border-indigo-200 text-white'}`}>
                                    {timeLeft}
                                </div>
                            </div>
                        )}
                        {room.status === 'reveal' && (
                            <div className="flex space-x-4 animate-fade-in-up">
                                <button onClick={handleShowLeaderboard} className="btn-3d-blue px-10 py-4 font-black text-2xl rounded-2xl flex items-center">
                                    ดูคะแนน <i className="fa-solid fa-list-ol ml-3"></i>
                                </button>
                            </div>
                        )}
                        {room.status === 'leaderboard' && (
                            <div className="flex space-x-4 animate-fade-in-up">
                                <button onClick={handleNextQuestion} className={`btn-3d px-10 py-4 font-black text-2xl rounded-2xl flex items-center ${isLast ? 'bg-pink-600 text-white box-shadow-pink-800' : 'btn-3d-emerald'}`}>
                                    {isLast ? 'สรุปผลเกม' : 'ข้อต่อไป'} <i className={`fa-solid ${isLast ? 'fa-trophy' : 'fa-chevron-right'} ml-3`}></i>
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Content Area */}
                    {(room.status === 'question' || room.status === 'reveal') && (
                        <>
                            <div className="bg-white flex-1 rounded-[3rem] shadow-lg flex flex-col items-center justify-center p-12 mb-8 text-center border-b-8 border-indigo-100 relative min-h-[300px]">
                                {room.status === 'question' && (
                                    <button onClick={handleSkipToReveal} className="absolute bottom-4 right-6 text-slate-400 hover:text-indigo-500 font-bold text-sm bg-slate-50 px-4 py-2 rounded-full border border-slate-200">
                                        ข้ามเวลา <i className="fa-solid fa-forward-step ml-1"></i>
                                    </button>
                                )}
                                <h2 className="text-6xl md:text-7xl font-black text-slate-800 leading-tight">{currentQ.question}</h2>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-6 min-h-[300px]">
                                {currentQ.options.map((opt, idx) => {
                                    const isCorrect = idx === currentQ.correctIndex;
                                    const isReveal = room.status === 'reveal';
                                    
                                    let btnClass = `${BTN_CLASSES[idx]} rounded-[3rem] shadow-lg relative flex flex-col items-center justify-center p-8 transition-all duration-500 border-t-2 border-white/20`;
                                    
                                    if (isReveal) {
                                        if (isCorrect) {
                                            btnClass += " scale-[1.02] z-10 shadow-2xl ring-8 ring-emerald-400";
                                        } else {
                                            btnClass += " opacity-40 scale-95 grayscale";
                                        }
                                    }

                                    const barHeight = totalAnswers > 0 ? (answerStats[idx] / totalAnswers) * 100 : 0;

                                    return (
                                        <div key={idx} className={btnClass}>
                                            <div className="absolute top-6 left-6 opacity-80">
                                                <ShapeIcon index={idx} className="w-16 h-16 text-white" />
                                            </div>
                                            <span className="text-white font-black text-5xl lg:text-6xl text-center px-16 z-10 drop-shadow-md">{opt}</span>
                                            
                                            {isReveal && (
                                                <div className="absolute right-8 bottom-8 flex flex-col items-center">
                                                    <div className="w-16 bg-black/20 rounded-t-lg relative flex items-end justify-center h-32">
                                                        <div className="w-full bg-white/90 rounded-t-lg transition-all duration-1000 ease-out" style={{height: `${barHeight}%`}}></div>
                                                    </div>
                                                    <div className="text-white font-black text-3xl mt-2 bg-black/30 px-4 py-1 rounded-full backdrop-blur-sm">{answerStats[idx]}</div>
                                                </div>
                                            )}
                                            
                                            {isReveal && isCorrect && (
                                                <div className="absolute top-6 right-6 text-emerald-400 bg-white rounded-full p-4 shadow-xl animate-bounce z-20">
                                                    <i className="fa-solid fa-check text-5xl"></i>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    )}

                    {room.status === 'leaderboard' && (
                        <div className="flex-1 flex flex-col items-center justify-center bg-white rounded-[3rem] shadow-xl p-12">
                            <h2 className="text-5xl font-black text-slate-800 mb-10"><i className="fa-solid fa-ranking-star text-amber-400 mr-4"></i> อันดับคะแนน</h2>
                            <div className="w-full max-w-4xl space-y-4">
                                {topPlayers.map((p, i) => (
                                    <div key={i} className={`flex items-center justify-between p-6 rounded-2xl ${i===0?'bg-amber-100 border-2 border-amber-300':i===1?'bg-slate-100 border-2 border-slate-300':i===2?'bg-orange-50 border-2 border-orange-200':'bg-slate-50 border border-slate-100'} animate-fade-in-up`} style={{animationDelay: `${i*0.1}s`}}>
                                        <div className="flex items-center">
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl font-black text-white mr-6 shadow-sm ${i===0?'bg-amber-500':i===1?'bg-slate-400':i===2?'bg-orange-400':'bg-slate-300'}`}>
                                                {i+1}
                                            </div>
                                            <div className="text-3xl font-bold text-slate-700">{p.name}</div>
                                        </div>
                                        <div className="text-4xl font-black text-indigo-600">{p.score}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {room.status === 'summary' && (
                        <div className="flex-1 flex flex-col items-center justify-center bg-gradient-to-b from-indigo-900 to-purple-900 rounded-[3rem] relative overflow-hidden p-12">
                            <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                                {[...Array(20)].map((_, i) => (
                                    <div key={i} className="absolute text-5xl animate-float opacity-80" style={{
                                        left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,

                                    }}>
                                        {['🎉', '🎊', '✨', '⭐', '🏆'][Math.floor(Math.random() * 5)]}
                                    </div>
                                ))}
                            </div>
                            <h2 className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_5px_5px_rgba(0,0,0,1)] mb-16 z-10">สุดยอดผู้ชนะ!</h2>
                            
                            <div className="flex items-end justify-center space-x-6 z-10 mb-16 h-80">
                                {/* 2nd Place */}
                                {topPlayers[1] && (
                                    <div className="flex flex-col items-center animate-fade-in-up" style={{animationDelay: '0.4s'}}>
                                        <div className="text-white font-bold text-3xl mb-2">{topPlayers[1].name}</div>
                                        <div className="bg-white/20 text-indigo-200 px-4 py-1 rounded-full font-bold mb-4">{topPlayers[1].score}</div>
                                        <div className="w-40 h-48 bg-gradient-to-t from-slate-400 to-slate-300 rounded-t-xl flex justify-center border-t-4 border-white/50 shadow-2xl relative">
                                            <div className="absolute -top-10 bg-slate-200 w-16 h-16 rounded-full flex items-center justify-center text-3xl font-black text-slate-500 border-4 border-white shadow-lg">2</div>
                                        </div>
                                    </div>
                                )}
                                {/* 1st Place */}
                                {topPlayers[0] && (
                                    <div className="flex flex-col items-center animate-fade-in-up" style={{animationDelay: '0.8s'}}>
                                        <div className="text-white font-bold text-4xl mb-2">{topPlayers[0].name}</div>
                                        <div className="bg-white/20 text-yellow-200 px-4 py-1 rounded-full font-bold mb-4">{topPlayers[0].score}</div>
                                        <div className="w-48 h-64 bg-gradient-to-t from-yellow-500 to-yellow-400 rounded-t-xl flex justify-center border-t-4 border-white/50 shadow-2xl relative">
                                            <div className="absolute -top-12 bg-yellow-300 w-20 h-20 rounded-full flex items-center justify-center text-4xl font-black text-yellow-700 border-4 border-white shadow-lg"><i className="fa-solid fa-crown"></i></div>
                                        </div>
                                    </div>

                                {/* 3rd Place */}
                                {topPlayers[2] && (
                                    <div className="flex flex-col items-center animate-fade-in-up" style={{animationDelay: '0.2s'}}>
                                        <div className="text-white font-bold text-2xl mb-2">{topPlayers[2].name}</div>
                                        <div className="bg-white/20 text-orange-200 px-4 py-1 rounded-full font-bold mb-4">{topPlayers[2].score}</div>
                                        <div className="w-40 h-36 bg-gradient-to-t from-orange-500 to-orange-400 rounded-t-xl flex justify-center border-t-4 border-white/50 shadow-2xl relative">
                                            <div className="absolute -top-8 bg-orange-300 w-14 h-14 rounded-full flex items-center justify-center text-2xl font-black text-orange-800 border-4 border-white shadow-lg">3</div>

                            <button onClick={handleCloseRoom} className="btn-3d bg-white text-indigo-900 px-12 py-5 rounded-full font-black text-2xl z-10">กลับหน้าหลัก</button>

        function PlayerGame({ roomCode, playerName, userId, showError, leaveRoom }) {
            const [room, setRoom] = useState(null);
            const [hasAnswered, setHasAnswered] = useState(false);
            const [lastScoreAdded, setLastScoreAdded] = useState(0);

            useEffect(() => {
                const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                const unsubscribe = window.fb.onSnapshot(roomRef, (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        setRoom(data);
                    } else {
                        showError("ห้องถูกปิดแล้ว");
                        leaveRoom();
                    }
                });
                return () => unsubscribe();
            }, [roomCode]);

            // Reset hasAnswered when new question starts
            useEffect(() => {
                if (room && room.status === 'question') {
                    setHasAnswered(false);
                    setLastScoreAdded(0);
                }
            }, [room?.status, room?.currentIdx]);

            // Calculate Score when state changes to Reveal (Client-side score resolution)
            useEffect(() => {
                if (room && room.status === 'reveal') {
                    const myPlayerData = room.players?.[userId];
                    const myAnswer = myPlayerData?.answers?.[room.currentIdx];
                    
                    if (myAnswer && !hasAnswered) { // Prevent double scoring
                        const currentQ = room.gameData.questions[room.currentIdx];
                        if (myAnswer.selectedIdx === currentQ.correctIndex) {
                            Sounds.correct();
                            // Score based on time (Max 1000)
                            const timeRatio = Math.max(0, 1 - (myAnswer.timeTaken / room.gameData.timeLimit));
                            const scoreToAdd = Math.round(500 + (500 * timeRatio));
                            setLastScoreAdded(scoreToAdd);
                            
                            // Update Firestore (Safe because each player writes to their own subfield)
                            const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                            window.fb.updateDoc(roomRef, {
                                [`players.${userId}.score`]: (myPlayerData.score || 0) + scoreToAdd
                            });
                        } else {
                            Sounds.wrong();
                        }
                    }
                }
            }, [room?.status]);

            const handleSelectAnswer = async (idx) => {
                if (hasAnswered || room.status !== 'question') return;
                
                setHasAnswered(true);
                Sounds.pop();
                
                const elapsed = (Date.now() - room.questionStartTime) / 1000;
                
                try {
                    const roomRef = window.fb.doc(window.fb.db, 'artifacts', window.fb.appId, 'public', 'data', 'rooms', roomCode);
                    await window.fb.updateDoc(roomRef, {
                        [`players.${userId}.answers.${room.currentIdx}`]: {
                            selectedIdx: idx,
                            timeTaken: elapsed
                        }
                    });
                } catch(e) {
                    console.error("Failed to submit answer", e);
                    setHasAnswered(false);
                }
            };

            if (!room) return <div className="flex h-screen items-center justify-center bg-indigo-600"><div className="loader border-t-white"></div></div>;

            const myScore = room.players?.[userId]?.score || 0;

            if (room.status === 'lobby') {
                return (
                    <div className="min-h-screen bg-indigo-600 flex flex-col items-center justify-center p-6 text-center relative">
                        <button onClick={leaveRoom} className="absolute top-6 left-6 text-white/50 hover:text-white"><i className="fa-solid fa-arrow-left text-2xl"></i></button>
                        <div className="text-white text-2xl font-bold mb-4">เข้าห้องสำเร็จ!</div>
                        <div className="bg-white px-8 py-4 rounded-full font-black text-3xl text-indigo-800 shadow-lg mb-12">{playerName}</div>
                        <div className="loader border-t-white border-4 w-12 h-12 mb-6"></div>
                        <div className="text-indigo-200 font-bold text-xl animate-pulse">มองไปที่หน้าจอห้องเรียน<br/>รอคุณครูเริ่มเกม...</div>
                    </div>
                );
            }

            if (room.status === 'question') {
                if (hasAnswered) {
                    return (
                        <div className="min-h-screen bg-slate-200 flex flex-col items-center justify-center p-6 text-center">
                            <div className="bg-white p-8 rounded-3xl shadow-md">
                                <div className="text-6xl mb-4">⏳</div>
                                <h3 className="text-2xl font-black text-slate-700">ส่งคำตอบแล้ว!</h3>
                                <p className="text-slate-500 font-bold mt-2">รอผู้เล่นคนอื่นสักครู่...</p>
                            </div>
                        </div>
                    );
                }

                // Show 4 Big Buttons
                return (
                    <div className="h-[100dvh] flex flex-col p-2 bg-slate-100 gap-2">
                        {/* Status bar */}
                        <div className="bg-white rounded-xl p-3 flex justify-between items-center shadow-sm">
                            <div className="font-bold text-slate-500">ข้อที่ {room.currentIdx + 1}</div>
                            <div className="font-black text-indigo-600">คะแนน: {myScore}</div>
                        </div>
                        <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-2">
                            {[0, 1, 2, 3].map(idx => (
                                <button 
                                    key={idx} 
                                    onClick={() => handleSelectAnswer(idx)}
                                    className={`${BTN_CLASSES[idx]} rounded-2xl shadow-md relative flex items-center justify-center active:scale-95 transition-transform touch-manipulation`}
                                >
                                    <ShapeIcon index={idx} className="w-24 h-24 text-white drop-shadow-md" />
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (room.status === 'reveal') {
                const currentQ = room.gameData.questions[room.currentIdx];
                const myAnswerIdx = room.players?.[userId]?.answers?.[room.currentIdx]?.selectedIdx;
                const isCorrect = myAnswerIdx === currentQ.correctIndex;
                const answered = myAnswerIdx !== undefined;

                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center p-6 text-center text-white ${answered && isCorrect ? 'bg-emerald-500' : 'bg-rose-500'}`}>
                        {answered ? (
                            <div className="animate-fade-in-up">
                                <div className="text-8xl mb-6">
                                    {isCorrect ? <i className="fa-solid fa-check-circle drop-shadow-lg"></i> : <i className="fa-solid fa-times-circle drop-shadow-lg"></i>}
                                </div>
                                <h2 className="text-5xl font-black mb-4 drop-shadow-md">{isCorrect ? 'ถูกต้อง!' : 'ผิด!'}</h2>
                                {isCorrect ? (
                                    <div className="bg-black/20 inline-block px-6 py-2 rounded-full font-bold text-2xl">+ {lastScoreAdded} คะแนน</div>
                                ) : (
                                    <div className="text-xl font-bold bg-black/20 inline-block px-6 py-2 rounded-full">พยายามใหม่ข้อหน้านะ!</div>
                                )}
                            </div>
                        ) : (
                            <div className="animate-fade-in-up">
                                <div className="text-8xl mb-6"><i className="fa-solid fa-clock drop-shadow-lg"></i></div>
                                <h2 className="text-4xl font-black mb-4 drop-shadow-md">หมดเวลา!</h2>
                                <div className="text-xl font-bold bg-black/20 inline-block px-6 py-2 rounded-full">ตอบไม่ทันนะจ๊ะ</div>
                            </div>
                        )}
                        <div className="absolute bottom-10 w-full text-center text-white/80 font-bold">รอข้อต่อไปจากหน้าจอหลัก...</div>
                    </div>
                );
            }

            if (room.status === 'leaderboard') {
                // Find my rank
                const sorted = Object.values(room.players || {}).sort((a,b) => (b.score||0) - (a.score||0));
                const myRank = sorted.findIndex(p => p.name === playerName) + 1;

                return (
                    <div className="min-h-screen bg-indigo-600 flex flex-col items-center justify-center p-8 text-center text-white relative">
                        <div className="text-indigo-200 font-bold text-xl mb-4 uppercase tracking-widest">อันดับของคุณคือ</div>
                        <div className="text-[8rem] font-black leading-none drop-shadow-2xl mb-8">{myRank || '-'}</div>
                        <div className="bg-white/20 px-8 py-3 rounded-full font-bold text-2xl border border-white/30 backdrop-blur-sm">คะแนนรวม: {myScore}</div>
                        <div className="absolute bottom-10 w-full text-center text-indigo-300 font-bold animate-pulse">เตรียมตัวลุยต่อ...</div>
                    </div>
                );
            }

            if (room.status === 'summary') {
                const sorted = Object.values(room.players || {}).sort((a,b) => (b.score||0) - (a.score||0));
                const myRank = sorted.findIndex(p => p.name === playerName) + 1;
                const isPodium = myRank <= 3;

                return (
                    <div className="min-h-screen bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col items-center justify-center p-8 text-center text-white relative">
                        {isPodium && <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 text-5xl">🎉🎊✨</div>}
                        
                        <div className="z-10 animate-fade-in-up bg-white/10 p-10 rounded-[3rem] border border-white/20 backdrop-blur-md w-full max-w-sm">
                            <h2 className="text-4xl font-black text-yellow-300 mb-6 drop-shadow-md">{isPodium ? 'ยินดีด้วย!' : 'เก่งมาก!'}</h2>
                            <div className="text-lg text-indigo-200 font-bold mb-2">คุณจบที่อันดับ</div>
                            <div className="text-8xl font-black mb-8 drop-shadow-xl">{myRank}</div>
                            <div className="text-2xl font-bold bg-black/30 py-3 rounded-2xl">คะแนน {myScore}</div>
                        </div>
                        
                        <button onClick={leaveRoom} className="btn-3d bg-white text-indigo-900 px-8 py-4 rounded-full font-black text-xl mt-12 z-10 w-full max-w-sm">
                            กลับหน้าหลัก
                        </button>
                    </div>
                );
            }

            return null;
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
