<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBO Quiz - สื่อการสอนยุคใหม่ (GAS Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Kanit', sans-serif; overflow-x: hidden; background-color: #f8fafc; }
        
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float 6s ease-in-out infinite; animation-delay: 3s; }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); } 
            50% { transform: translateY(-20px) rotate(10deg); } 
            100% { transform: translateY(0px) rotate(0deg); } 
        }

        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.8); }
        
        /* ปุ่มสไตล์ EdTech 3D */
        .btn-3d { box-shadow: 0 8px 0 rgba(0,0,0,0.2); transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-3d:active { box-shadow: 0 0px 0 rgba(0,0,0,0.2); transform: translateY(8px); }
        .btn-3d-emerald { background-color: #10b981; box-shadow: 0 8px 0 #047857; color: white; }
        .btn-3d-emerald:active { box-shadow: 0 0px 0 #047857; transform: translateY(8px); }
        .btn-3d-blue { background-color: #3b82f6; box-shadow: 0 8px 0 #1d4ed8; color: white; }
        .btn-3d-blue:active { box-shadow: 0 0px 0 #1d4ed8; transform: translateY(8px); }
        .btn-3d-slate { background-color: #334155; box-shadow: 0 8px 0 #0f172a; color: white; }
        .btn-3d-slate:active { box-shadow: 0 0px 0 #0f172a; transform: translateY(8px); }
        
        /* ซ่อน Scrollbar สำหรับ UI ที่สวยงาม */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // สร้าง ID ผู้ใช้จำลอง (เก็บไว้ใน LocalStorage เพื่อให้จำตัวตนได้)
        const getUserId = () => {
            let uid = localStorage.getItem('tobo_uid');
            if (!uid) {
                uid = 'user_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('tobo_uid', uid);
            }
            return uid;
        };

        const USER_ID = getUserId();
        const GAS_URL_KEY = 'tobo_gas_url';
        const GEMINI_KEY_KEY = 'tobo_gemini_key';

        // โค้ด Google Apps Script ที่ผู้ใช้ต้องนำไป Deploy
        const GAS_BACKEND_CODE = `// โค้ด Backend สำหรับ TOBO Quiz (วางใน Google Apps Script)
function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(10000); // ป้องกันข้อมูลชนกัน
  try {
    const params = JSON.parse(e.postData.contents);
    const action = params.action;
    const pin = String(params.pin);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    
    // สร้าง Sheet ถ้ายังไม่มี
    let sheet = ss.getSheetByName('TOBO_Games');
    if(!sheet) {
      sheet = ss.insertSheet('TOBO_Games');
      sheet.appendRow(['PIN', 'Data']);
    }
    
    const dataRange = sheet.getDataRange();
    const values = dataRange.getValues();
    let rowIndex = -1;
    for (let i = 1; i < values.length; i++) {
      if (String(values[i][0]) === pin) { rowIndex = i + 1; break; }
    }
    
    if (action === 'create') {
      if (rowIndex !== -1) sheet.getRange(rowIndex, 2).setValue(JSON.stringify(params.gameData));
      else sheet.appendRow([pin, JSON.stringify(params.gameData)]);
      return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'get') {
      if (rowIndex === -1) return ContentService.createTextOutput(JSON.stringify({error: 'Room not found'})).setMimeType(ContentService.MimeType.JSON);
      return ContentService.createTextOutput(JSON.stringify({success: true, data: JSON.parse(values[rowIndex-1][1])})).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'join') {
      if (rowIndex === -1) return ContentService.createTextOutput(JSON.stringify({error: 'Room not found'})).setMimeType(ContentService.MimeType.JSON);
      let gameData = JSON.parse(values[rowIndex-1][1]);
      if (gameData.status !== 'lobby') return ContentService.createTextOutput(JSON.stringify({error: 'Game started'})).setMimeType(ContentService.MimeType.JSON);
      if (!gameData.players) gameData.players = {};
      gameData.players[params.uid] = { name: params.name, score: 0, lastAnswer: null, answerTime: null };
      sheet.getRange(rowIndex, 2).setValue(JSON.stringify(gameData));
      return ContentService.createTextOutput(JSON.stringify({success: true, data: gameData})).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'updateState') {
      if (rowIndex === -1) return ContentService.createTextOutput(JSON.stringify({error: 'Room not found'})).setMimeType(ContentService.MimeType.JSON);
      let gameData = JSON.parse(values[rowIndex-1][1]);
      gameData.status = params.status;
      if (params.currentQuestionIndex !== undefined) gameData.currentQuestionIndex = params.currentQuestionIndex;
      if (params.questionStartTime !== undefined) gameData.questionStartTime = params.questionStartTime;
      if (params.clearAnswers && gameData.players) {
         for (let uid in gameData.players) gameData.players[uid].lastAnswer = null;
      }
      sheet.getRange(rowIndex, 2).setValue(JSON.stringify(gameData));
      return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'submitAnswer') {
      if (rowIndex === -1) return ContentService.createTextOutput(JSON.stringify({error: 'Room not found'})).setMimeType(ContentService.MimeType.JSON);
      let gameData = JSON.parse(values[rowIndex-1][1]);
      if (gameData.players && gameData.players[params.uid]) {
         gameData.players[params.uid].lastAnswer = params.answer;
         gameData.players[params.uid].score = params.newScore;
         sheet.getRange(rowIndex, 2).setValue(JSON.stringify(gameData));
      }
      return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
    }
    
    if (action === 'delete') {
      if (rowIndex !== -1) sheet.deleteRow(rowIndex);
      return ContentService.createTextOutput(JSON.stringify({success: true})).setMimeType(ContentService.MimeType.JSON);
    }
    
    return ContentService.createTextOutput(JSON.stringify({error: 'Unknown action'})).setMimeType(ContentService.MimeType.JSON);
  } catch(e) {
    return ContentService.createTextOutput(JSON.stringify({error: e.toString()})).setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}`;

        // ระบบเสียง
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = (freq, type, duration) => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        };

        const Sounds = {
            tick: () => playTone(800, 'square', 0.05),
            join: () => { playTone(440, 'sine', 0.1); setTimeout(()=>playTone(554, 'sine', 0.2), 100); },
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); setTimeout(()=>playTone(783.99, 'sine', 0.4), 200); },
            wrong: () => { playTone(300, 'sawtooth', 0.3); setTimeout(()=>playTone(250, 'sawtooth', 0.4), 200); },
            fanfare: () => { playTone(523, 'square', 0.2); setTimeout(()=>playTone(523, 'square', 0.2), 200); setTimeout(()=>playTone(783, 'square', 0.6), 400); }
        };

        // ฟังก์ชันเรียก API ไปยัง Google Apps Script
        const apiCall = async (action, payload) => {
            const url = localStorage.getItem(GAS_URL_KEY);
            if (!url) throw new Error("ยังไม่ได้ตั้งค่า Google Apps Script Web App URL");
            
            try {
                // ใช้ text/plain เพื่อหลบหลีก CORS
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                });
                
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            } catch (err) {
                console.error("API Error:", err);
                throw new Error("การเชื่อมต่อฐานข้อมูลล้มเหลว หรือ URL ไม่ถูกต้อง");
            }
        };

        // ฟังก์ชันสร้างชุดคำถามด้วย Gemini API ตรงจากฝั่ง Client
        const generateQuizAI = async (topic, grade, count) => {
            let apiKey = localStorage.getItem(GEMINI_KEY_KEY) || ""; // รองรับ Canvas Auto Key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: `สร้างคำถามปรนัย 4 ตัวเลือก หัวข้อ: ${topic} สำหรับนักเรียนระดับชั้น: ${grade} จำนวน: ${count} ข้อ เนื้อหาต้องถูกต้องตามหลักวิชาการ` }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                question: { type: "STRING" },
                                options: { 
                                    type: "ARRAY", 
                                    items: { type: "STRING" }, 
                                    description: "Exactly 4 options" 
                                },
                                correctIndex: { 
                                    type: "INTEGER", 
                                    description: "Index 0 to 3 representing correct option" 
                                },
                                explanation: { 
                                    type: "STRING", 
                                    description: "Short explanation of the answer" 
                                }
                            },
                            required: ["question", "options", "correctIndex", "explanation"]
                        }
                    }
                }
            };

            try {
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await res.json();
                if(result.error) throw new Error(result.error.message);
                
                const jsonText = result.candidates[0].content.parts[0].text;
                return JSON.parse(jsonText);
            } catch (error) {
                throw new Error("สร้างคำถามจาก AI ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่า API Key");
            }
        };

        const ShapeIcon = ({ index, className = "w-16 h-16 text-white" }) => {
            const shapes = [
                <polygon points="12 2 22 20 2 20" fill="currentColor"/>, 
                <polygon points="12 2 22 12 12 22 2 12" fill="currentColor"/>, 
                <circle cx="12" cy="12" r="10" fill="currentColor"/>, 
                <rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/> 
            ];
            return <svg viewBox="0 0 24 24" className={className}>{shapes[index]}</svg>;
        };

        const COLORS = ['bg-rose-500', 'bg-blue-500', 'bg-amber-500', 'bg-emerald-500'];

        function SetupModal({ onClose, showError }) {
            const [gasUrl, setGasUrl] = useState(localStorage.getItem(GAS_URL_KEY) || '');
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem(GEMINI_KEY_KEY) || '');

            const handleSave = () => {
                if(!gasUrl) return showError("กรุณากรอก Web App URL");
                localStorage.setItem(GAS_URL_KEY, gasUrl);
                localStorage.setItem(GEMINI_KEY_KEY, geminiKey);
                showError("บันทึกการตั้งค่าเรียบร้อย (ข้อความสีเขียว)", true);
                onClose();
            };

            const copyCode = () => {
                navigator.clipboard.writeText(GAS_BACKEND_CODE).then(() => {
                    showError("คัดลอกโค้ดไปยังคลิปบอร์ดแล้ว", true);
                }).catch(() => {
                    // Fallback สำหรับ iframe
                    const textArea = document.createElement("textarea");
                    textArea.value = GAS_BACKEND_CODE;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    showError("คัดลอกโค้ดไปยังคลิปบอร์ดแล้ว", true);
                });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl animate-fade-in-up border-4 border-indigo-500">
                        <div className="bg-indigo-600 text-white p-6 sticky top-0 flex justify-between items-center z-10 shadow-md">
                            <h2 className="text-2xl font-black"><i className="fa-solid fa-gear mr-2"></i> ตั้งค่าฐานข้อมูล (Google Sheets)</h2>
                            <button onClick={onClose} className="text-white hover:text-indigo-200"><i className="fa-solid fa-xmark text-3xl"></i></button>
                        </div>
                        <div className="p-8 space-y-8">
                            
                            <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl">
                                <h3 className="font-bold text-amber-800 text-lg mb-2">วิธีติดตั้ง Backend ภายใน 2 นาที:</h3>
                                <ol className="list-decimal list-inside text-amber-900 space-y-1 text-sm font-medium">
                                    <li>สร้าง Google Sheets ใหม่เปล่าๆ 1 ไฟล์</li>
                                    <li>ไปที่เมนู <b>ส่วนขยาย (Extensions)</b> &gt; <b>Apps Script</b></li>
                                    <li>คัดลอกโค้ดด้านล่างนี้ไปวางทับโค้ดเดิมทั้งหมด</li>
                                    <li>กด <b>นำไปใช้งาน (Deploy)</b> &gt; <b>การทำให้ใช้งานได้รายการใหม่ (New deployment)</b></li>
                                    <li>เลือกประเภท <b>เว็บแอป (Web app)</b>, การเข้าถึงเป็น <b>ทุกคน (Anyone)</b></li>
                                    <li>กดยืนยันสิทธิ์ นำ <b>Web App URL</b> มาใส่ในช่องด้านล่าง</li>
                                </ol>
                            </div>

                            <div>
                                <div className="flex justify-between items-end mb-2">
                                    <label className="font-bold text-slate-700">1. โค้ด Apps Script</label>
                                    <button onClick={copyCode} className="text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded font-bold transition-colors">
                                        <i className="fa-regular fa-copy mr-1"></i> คัดลอกโค้ด
                                    </button>
                                </div>
                                <textarea readOnly value={GAS_BACKEND_CODE} className="w-full h-40 bg-slate-800 text-emerald-400 font-mono text-sm p-4 rounded-xl outline-none border border-slate-700" />
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="font-bold text-slate-700 mb-2 block">2. วาง Google Apps Script Web App URL ที่นี่ <span className="text-rose-500">*</span></label>
                                    <input type="text" value={gasUrl} onChange={e=>setGasUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none font-medium" />
                                </div>
                                
                                <div>
                                    <label className="font-bold text-slate-700 mb-2 block">3. Gemini API Key (เว้นว่างไว้หากใช้บนเว็บไซต์นี้)</label>
                                    <input type="password" value={geminiKey} onChange={e=>setGeminiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none font-medium" />
                                </div>
                            </div>
                            
                            <button onClick={handleSave} className="w-full btn-3d-emerald py-4 rounded-xl font-black text-xl">
                                บันทึกการตั้งค่า
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('home'); 
            const [gamePin, setGamePin] = useState('');
            const [gameState, setGameState] = useState(null);
            
            const [errorMsg, setErrorMsg] = useState({ text: '', isSuccess: false });
            const [showSetup, setShowSetup] = useState(false);

            const showError = (msg, isSuccess = false) => { 
                setErrorMsg({ text: msg, isSuccess }); 
                setTimeout(() => setErrorMsg({ text: '', isSuccess: false }), 4000); 
            };

            const goHome = () => { setView('home'); setGamePin(''); setGameState(null); };

            // === ระบบ Polling (หัวใจสำคัญในการเชื่อมต่อกับ GAS) ===
            useEffect(() => {
                if (!gamePin || view === 'home') return;
                
                let isMounted = true;
                let failCount = 0;

                const pollGame = async () => {
                    try {
                        const data = await apiCall('get', { pin: gamePin });
                        if (isMounted && data.success) {
                            setGameState(data.data);
                            failCount = 0; // Reset fail count
                        } else if (data.error === 'Room not found') {
                            if (view === 'player') {
                                showError("คุณครูได้ปิดห้องเกมนี้ไปแล้วครับ");
                                goHome();
                            }
                        }
                    } catch (err) {
                        failCount++;
                        if (failCount > 3 && isMounted) {
                           // เงียบไว้เพื่อไม่ให้แจ้งเตือนบ่อยเกินไป
                           console.warn("Polling connection unstable.");
                        }
                    }
                };

                // เรียกทันที 1 ครั้ง
                pollGame();
                
                // ตั้งค่า Polling ทุกๆ 2.5 วินาที
                const interval = setInterval(pollGame, 2500); 
                
                return () => { 
                    isMounted = false; 
                    clearInterval(interval); 
                };
            }, [gamePin, view]);

            return (
                <div className="min-h-screen flex flex-col font-['Kanit'] relative">
                    {/* Error / Success Toast */}
                    {errorMsg.text && (
                        <div className={`fixed top-4 right-4 ${errorMsg.isSuccess ? 'bg-emerald-600 border-emerald-400' : 'bg-red-600 border-red-400'} text-white px-6 py-4 rounded-2xl shadow-2xl z-[200] animate-fade-in-up border-2 flex items-center font-bold text-lg`}>
                            <i className={`fa-solid ${errorMsg.isSuccess ? 'fa-check-circle' : 'fa-circle-exclamation'} mr-3 text-2xl`}></i> {errorMsg.text}
                        </div>
                    )}
                    
                    {/* ปลดล็อกการบังคับตั้งค่า GAS */}
                    {!localStorage.getItem(GAS_URL_KEY) && !showSetup && view === 'home' && (
                        <div className="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-amber-100 text-amber-800 px-6 py-3 rounded-full shadow-lg border border-amber-300 font-bold z-40 animate-bounce flex items-center cursor-pointer hover:bg-amber-200" onClick={() => setShowSetup(true)}>
                            <i className="fa-solid fa-triangle-exclamation mr-2 text-rose-500"></i> คุณยังไม่ได้ตั้งค่าฐานข้อมูล (คลิก)
                        </div>
                    )}

                    {showSetup && <SetupModal onClose={() => setShowSetup(false)} showError={showError} />}
                    
                    {view === 'home' && <HomeView setView={setView} setGamePin={setGamePin} showError={showError} onOpenSetup={() => setShowSetup(true)} />}
                    {view === 'host' && gameState && <HostView game={gameState} pin={gamePin} goHome={goHome} showError={showError} />}
                    {view === 'player' && gameState && <PlayerView game={gameState} pin={gamePin} goHome={goHome} showError={showError} />}
                </div>
            );
        }

        function HomeView({ setView, setGamePin, showError, onOpenSetup }) {
            const [mode, setMode] = useState('select'); 
            const [pin, setPin] = useState('');
            const [name, setName] = useState('');
            
            const [topic, setTopic] = useState('');
            const [grade, setGrade] = useState('ป.4');
            const [count, setCount] = useState(5);
            const [timeLimit, setTimeLimit] = useState(15);
            
            const [loading, setLoading] = useState(false);
            const [loadingText, setLoadingText] = useState('กำลังโหลด...');

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const pinParam = urlParams.get('pin');
                if (pinParam) {
                    setMode('join');
                    setPin(pinParam);
                }
            }, []);

            const handleJoin = async (e) => {
                e.preventDefault();
                const cleanPin = pin.trim();
                if(!cleanPin || !name) return showError("กรอกข้อมูลให้ครบถ้วน");
                
                setLoadingText("กำลังเข้าห้อง...");
                setLoading(true);
                try {
                    const data = await apiCall('join', { pin: cleanPin, uid: USER_ID, name });
                    setGamePin(cleanPin);
                    setView('player');
                    Sounds.join();
                } catch(err) { 
                    showError(err.message); 
                }
                setLoading(false);
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                if(!topic) return showError("กรุณาระบุหัวข้อ");
                if(!localStorage.getItem(GAS_URL_KEY)) return showError("กรุณาตั้งค่าฐานข้อมูลก่อนสร้างห้อง");
                
                setLoadingText("AI กำลังแต่งโจทย์ (ประมาณ 10 วินาที)...");
                setLoading(true);
                try {
                    // 1. เรียก Gemini API สร้างโจทย์
                    const questions = await generateQuizAI(topic, grade, Number(count));
                    
                    setLoadingText("กำลังสร้างห้องเกม...");
                    // 2. สร้างห้องลง Google Sheets
                    const newPin = Math.floor(1000 + Math.random() * 9000).toString();
                    const gameData = {
                        status: 'lobby',
                        currentQuestionIndex: 0,
                        timeLimit: Number(timeLimit),
                        players: {},
                        questions,
                        topic,
                        gradeLevel: grade,
                        createdAt: Date.now()
                    };
                    
                    await apiCall('create', { pin: newPin, gameData });
                    
                    setGamePin(newPin);
                    setView('host');
                } catch(err) { 
                    showError(err.message); 
                }
                setLoading(false);

            return (

                    {/* ด้านซ้าย: แนะนำ */}

                            {/* เครดิต */}
                            <div className="bg-black/30 rounded-2xl p-5 backdrop-blur-sm border border-white/10 flex items-center max-w-sm">
                                <div className="bg-gradient-to-br from-indigo-400 to-purple-500 p-4 rounded-xl mr-5 shadow-lg">
                                    <i className="fa-solid fa-code text-white text-2xl"></i>

                                    <div className="text-base font-bold text-white mb-1">
                                        ครูมิน อลีมิน เจ๊ะอีซอ

                                    <div className="text-base font-bold text-white">
                                        ครูยี แวอัสรี แวมายิ
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ด้านขวา: เมนูหลัก */}
                    <div className="w-full md:w-[40%] flex items-center justify-center p-6 md:p-12 relative bg-white border-l border-slate-200 shadow-[-10px_0_30px_rgba(0,0,0,0.03)]">
                        <div className="w-full max-w-md">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-20 text-indigo-600 animate-pulse">
                                    <i className="fa-solid fa-spinner fa-spin text-7xl mb-6"></i>
                                    <h2 className="text-3xl font-black text-center">{loadingText}<br/><span className="text-xl text-slate-500 font-medium mt-2 block">กรุณารอสักครู่</span></h2>
                                </div>
                            ) : mode === 'select' ? (

                                    <div className="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-[2rem] flex items-center justify-center mx-auto mb-2 transform rotate-12 shadow-lg">
                                        <i className="fa-solid fa-gamepad text-5xl"></i>
                                    </div>

                                    <div className="space-y-5 mt-8">
                                        <button onClick={() => setMode('join')} className="w-full btn-3d-emerald rounded-[2rem] p-6 flex items-center justify-center text-3xl font-black">
                                            <i className="fa-solid fa-users mr-4"></i> ผู้เล่น (นักเรียน)
                                        </button>
                                        <button onClick={() => setMode('create')} className="w-full btn-3d-blue rounded-[2rem] p-6 flex items-center justify-center text-3xl font-black">

                            ) : mode === 'join' ? (
                                <form onSubmit={handleJoin} className="space-y-6 animate-fade-in-up bg-white p-8 rounded-[2.5rem] shadow-[0_10px_40px_rgba(0,0,0,0.08)] border-2 border-slate-100">
                                    <button type="button" onClick={()=>setMode('select')} className="text-slate-400 font-bold hover:text-indigo-600 flex items-center mb-2 transition-colors">
                                        <i className="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับ
                                    </button>
                                    <div className="text-center mb-8">
                                        <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i className="fa-solid fa-users text-3xl"></i>
                                        </div>
                                        <h2 className="text-3xl font-black text-slate-800">เข้าห้องเกม</h2>
                                    </div>
                                    <input type="number" placeholder="รหัสห้อง (PIN)" value={pin} onChange={(e)=>setPin(e.target.value)} className="w-full text-center text-4xl font-black p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:bg-white focus:outline-none tracking-widest placeholder:text-2xl placeholder:tracking-normal placeholder:font-medium text-slate-700 transition-all" required />
                                    <input type="text" placeholder="ชื่อเล่นของคุณ" value={name} onChange={(e)=>setName(e.target.value)} className="w-full text-center text-2xl font-bold p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-emerald-500 focus:bg-white focus:outline-none text-slate-700 transition-all" required maxLength="15"/>
                                    <button type="submit" className="w-full btn-3d-slate rounded-2xl p-5 text-2xl font-black mt-2">เข้าเล่นเลย!</button>
                                </form>
                            ) : (
                                <form onSubmit={handleCreate} className="space-y-5 animate-fade-in-up bg-white p-8 rounded-[2.5rem] shadow-[0_10px_40px_rgba(0,0,0,0.08)] border-2 border-slate-100">
                                    <button type="button" onClick={()=>setMode('select')} className="text-slate-400 font-bold hover:text-indigo-600 flex items-center transition-colors">
                                        <i className="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับ
                                    </button>
                                    <div className="text-center mb-6">
                                        <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <i className="fa-solid fa-wand-magic-sparkles text-3xl"></i>
                                        </div>
                                        <h2 className="text-3xl font-black text-slate-800">สร้างห้องด้วย AI</h2>
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 font-bold mb-2">หัวข้อเรื่อง / รายวิชา</label>
                                        <input type="text" placeholder="เช่น สัตว์น่ารู้, ประวัติศาสตร์" value={topic} onChange={(e)=>setTopic(e.target.value)} className="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white focus:outline-none transition-all" required />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-slate-500 font-bold mb-2">ระดับชั้น</label>
                                            <select value={grade} onChange={(e)=>setGrade(e.target.value)} className="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white focus:outline-none cursor-pointer transition-all">
                                                {['ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6'].map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 font-bold mb-2">จำนวนข้อ</label>
                                            <input type="number" value={count} onChange={(e)=>setCount(e.target.value)} min="1" max="20" className="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white focus:outline-none transition-all" required />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 font-bold mb-2">เวลาต่อข้อ</label>
                                            <select value={timeLimit} onChange={(e)=>setTimeLimit(e.target.value)} className="w-full text-xl font-bold p-4 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:bg-white focus:outline-none cursor-pointer transition-all">
                                                <option value="10">10 วินาที</option>
                                                <option value="15">15 วินาที</option>
                                                <option value="20">20 วินาที</option>
                                                <option value="30">30 วินาที</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full btn-3d-blue rounded-xl p-5 text-2xl font-black mt-6 flex items-center justify-center">
                                        สร้างชุดคำถาม <i className="fa-solid fa-chevron-right ml-2"></i>
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function HostView({ game, pin, goHome, showError }) {
            const players = Object.values(game.players || {});
            const gameTimeLimit = game.timeLimit || 15;
            const [timeLeft, setTimeLeft] = useState(gameTimeLimit);
            const [showExplanation, setShowExplanation] = useState(false);
            const [showQR, setShowQR] = useState(false);

            const hostUpdateState = async (updates) => {
                try {
                    await apiCall('updateState', { pin, ...updates });
                } catch(e) {
                    showError(e.message);
                }
            };

            useEffect(() => {
                if (game.status === 'podium') Sounds.fanfare();
            }, [game.status]);

            // Timer (Host holds the master timer)
            useEffect(() => {
                if (game.status === 'question' && game.questionStartTime) {
                    const interval = setInterval(() => {
                        const elapsed = (Date.now() - game.questionStartTime) / 1000;
                        const remaining = Math.max(0, Math.ceil(gameTimeLimit - elapsed));
                        setTimeLeft(remaining);
                        
                        if (remaining > 0 && remaining <= 5) Sounds.tick();
                        
                        if (remaining <= 0) {
                            clearInterval(interval);
                            hostUpdateState({ status: 'reveal' }); // Force state change
                        }
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [game.status, game.questionStartTime, gameTimeLimit]);

            // Auto-reveal if everyone answered
            useEffect(() => {
                if (game.status === 'question' && players.length > 0) {
                    if (players.every(p => p.lastAnswer !== null)) {
                        hostUpdateState({ status: 'reveal' });
                    }
                }
            }, [game.status, players]);

            const endAndSave = async () => {
                await apiCall('delete', { pin });
                goHome();
            };

            // LOBBY STATE
            if (game.status === 'lobby') {
                const joinUrl = window.location.origin + window.location.pathname + '?pin=' + pin;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(joinUrl)}`;

                return (
                    <div className="flex-1 flex flex-col bg-slate-100 relative">
                        <div className="bg-white px-8 py-4 flex justify-between items-center shadow-sm z-10 border-b border-slate-200">
                            <div className="text-3xl font-black text-indigo-700 tracking-tight">TOBO <span className="text-yellow-500">Quiz</span></div>
                            <div className="text-2xl font-bold bg-indigo-50 text-indigo-700 px-6 py-2 rounded-xl flex items-center border border-indigo-100">
                                <i className="fa-solid fa-users mr-3"></i> <span className="text-3xl">{players.length}</span>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col items-center justify-center pt-8 pb-4 text-center z-10">
                            <h2 className="text-3xl md:text-4xl text-slate-500 font-black mb-4">เข้าร่วมเกมด้วย PIN หรือ สแกน QR Code</h2>
                            
                            {!showQR ? (
                                <div className="text-[6rem] md:text-[10rem] font-black bg-white px-10 md:px-20 py-4 md:py-8 rounded-[3rem] md:rounded-[4rem] shadow-xl tracking-widest text-slate-800 border-b-8 border-indigo-200 mb-6">
                                    {pin}
                                </div>
                            ) : (
                                <div className="bg-white p-6 rounded-[2rem] shadow-xl mb-6 border-4 border-indigo-200 animate-fade-in-up">
                                    <img src={qrUrl} alt="QR Code" className="w-48 h-48 md:w-64 md:h-64 object-contain" />
                                </div>
                            )}

                            <button onClick={() => setShowQR(!showQR)} className="mb-6 text-indigo-600 font-bold bg-indigo-100 px-6 py-2 rounded-full hover:bg-indigo-200 flex items-center transition-colors">
                                <i className="fa-solid fa-qrcode mr-2"></i> {showQR ? 'ซ่อน QR Code' : 'แสดง QR Code'}
                            </button>

                            {players.length > 0 && (
                                <button onClick={() => hostUpdateState({ status: 'question', currentQuestionIndex: 0, questionStartTime: Date.now() })} className="btn-3d btn-3d-blue px-12 md:px-16 py-4 md:py-6 text-3xl md:text-4xl font-black rounded-full flex items-center animate-bounce mt-4">
                                    <i className="fa-solid fa-play mr-4"></i> เริ่มเกม!
                                </button>
                            )}
                        </div>

                        <div className="w-full bg-slate-200/80 p-8 flex-1 overflow-y-auto border-t-4 border-white shadow-inner">
                            <div className="flex flex-wrap gap-4 justify-center items-start max-w-7xl mx-auto">
                                {players.length === 0 ? <p className="text-3xl text-slate-400 font-bold mt-10">รอผู้เล่นเข้าร่วม...</p> : null}
                                {players.map((p, i) => (
                                    <div key={i} className="text-3xl md:text-4xl font-black text-indigo-700 bg-white px-8 py-4 rounded-full shadow-md border-2 border-indigo-100 uppercase tracking-wider animate-fade-in-up hover:-translate-y-1 transition-transform">
                                        {p.name}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            const currentQ = game.questions[game.currentQuestionIndex];
            const isReveal = game.status === 'reveal';
            const isLast = game.currentQuestionIndex >= game.questions.length - 1;
            const answerCounts = [0, 0, 0, 0];
            players.forEach(p => { if (p.lastAnswer !== null) answerCounts[p.lastAnswer]++; });

            // QUESTION / REVEAL STATE
            if (game.status === 'question' || game.status === 'reveal') {
                return (
                    <div className="flex-1 flex flex-col bg-slate-100 p-4 md:p-8 relative">
                        {showExplanation && (
                            <div className="absolute inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4 md:p-8 backdrop-blur-sm">
                                <div className="bg-white w-full max-w-4xl rounded-[3rem] p-8 md:p-12 text-center animate-fade-in-up relative shadow-2xl border-b-8 border-indigo-500">
                                    <div className="flex justify-end w-full mb-6">
                                       <button onClick={()=>setShowExplanation(false)} className="bg-rose-100 text-rose-600 hover:bg-rose-500 hover:text-white px-6 py-3 rounded-full font-bold text-xl flex items-center transition-colors shadow-sm">
                                           <i className="fa-solid fa-xmark mr-3 text-2xl"></i> ปิดคำอธิบาย
                                       </button>
                                    </div>
                                    <h3 className="text-3xl md:text-5xl font-black text-indigo-600 mb-8 flex items-center justify-center">
                                        <i className="fa-solid fa-lightbulb mr-4 text-yellow-400 text-5xl"></i> คำอธิบายเฉลย
                                    </h3>
                                    <p className="text-3xl md:text-5xl font-bold text-slate-700 leading-normal mb-8">{currentQ.explanation}</p>
                                </div>
                            </div>
                        )}

                        <div className="flex justify-between items-center mb-6">
                            <div className="bg-white px-6 md:px-8 py-3 rounded-2xl font-black text-xl md:text-2xl shadow-sm border-2 border-slate-200 text-indigo-600">
                                ข้อ {game.currentQuestionIndex + 1} / {game.questions.length}
                            </div>
                            
                            {isReveal ? (
                                <div className="flex gap-2 md:gap-4">
                                    <button onClick={()=>setShowExplanation(true)} className="btn-3d bg-amber-500 px-6 md:px-8 py-3 md:py-4 font-black text-xl md:text-2xl text-white rounded-2xl hover:bg-amber-600 flex items-center">
                                        <i className="fa-solid fa-circle-info mr-2"></i> คำอธิบาย
                                    </button>
                                    <button onClick={() => hostUpdateState({ status: isLast ? 'podium' : 'leaderboard' })} className={`btn-3d px-6 md:px-10 py-3 md:py-4 font-black text-xl md:text-2xl rounded-2xl flex items-center ${isLast ? 'bg-pink-600 hover:bg-pink-700 text-white' : 'btn-3d-blue'}`}>
                                        {isLast ? 'สรุปผล' : 'ถัดไป'} <i className={`fa-solid ${isLast ? 'fa-trophy' : 'fa-chevron-right'} ml-2`}></i>
                                    </button>
                                </div>
                            ) : (
                                <div className="flex items-center space-x-4 md:space-x-8">
                                    <div className="text-xl md:text-2xl font-bold text-slate-500 bg-white px-6 md:px-8 py-3 rounded-2xl shadow-sm border-2 border-slate-200">
                                        ตอบ: <span className="text-indigo-600 font-black">{players.filter(p=>p.lastAnswer!==null).length}</span>/{players.length}
                                    </div>
                                    <div className={`w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-4xl md:text-5xl font-black shadow-lg border-4 ${timeLeft <= 5 ? 'bg-red-500 border-red-200 animate-pulse text-white' : 'bg-indigo-600 border-indigo-200 text-white'}`}>
                                        {timeLeft}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-white flex-1 rounded-[3rem] shadow-lg flex flex-col items-center justify-center p-8 md:p-16 mb-8 text-center border-b-8 border-indigo-100">
                            <h2 className="text-4xl md:text-7xl font-black text-slate-800 leading-normal">{currentQ.question}</h2>
                        </div>

                        <div className="grid grid-cols-2 gap-4 md:gap-8 min-h-[250px] md:min-h-[320px]">
                            {currentQ.options.map((opt, idx) => {
                                const isCorrect = idx === currentQ.correctIndex;
                                const dimClass = isReveal && !isCorrect ? 'opacity-30 scale-95 grayscale' : (isReveal && isCorrect ? 'scale-105 z-10 shadow-2xl ring-8 ring-emerald-400' : '');
                                return (
                                    <div key={idx} className={`${COLORS[idx]} ${dimClass} rounded-[2.5rem] shadow-md relative flex flex-col items-center justify-center p-4 md:p-6 transition-all duration-500`}>
                                        <div className="absolute top-4 left-4 opacity-80"><ShapeIcon index={idx} className="w-8 h-8 md:w-12 md:h-12 text-white" /></div>
                                        <span className="text-white font-black text-3xl md:text-5xl text-center px-4 md:px-16 z-10 drop-shadow-md">{opt}</span>
                                        
                                        {isReveal && (
                                            <div className="absolute bottom-4 w-full flex justify-center z-20">
                                                <div className="bg-black/60 text-white font-black text-2xl md:text-3xl px-6 py-2 rounded-full flex items-center shadow-inner">
                                                    <i className="fa-solid fa-users mr-3"></i> {answerCounts[idx]}
                                                </div>
                                            </div>
                                        )}
                                        {isReveal && isCorrect && <div className="absolute top-4 right-4 text-white bg-black/30 rounded-full p-2 backdrop-blur-sm animate-bounce z-20"><i className="fa-solid fa-check w-12 h-12 flex items-center justify-center text-3xl"></i></div>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            // LEADERBOARD
            if (game.status === 'leaderboard') {
                const sortedPlayers = Object.entries(game.players || {}).map(([uid, data]) => ({ uid, ...data })).sort((a, b) => b.score - a.score).slice(0, 5);
                const isLast = game.currentQuestionIndex >= game.questions.length - 1;

                const nextAction = async () => {
                    if (isLast) hostUpdateState({ status: 'podium' });
                    else {
                        hostUpdateState({ 
                            status: 'question', 
                            currentQuestionIndex: game.currentQuestionIndex + 1, 
                            clearAnswers: true,
                            questionStartTime: Date.now() 
                        });
                    }
                };

                return (
                    <div className="flex-1 flex flex-col bg-gradient-to-br from-indigo-800 to-purple-900 p-6 md:p-10 overflow-y-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 md:mb-12 gap-4">
                            <h2 className="text-4xl md:text-5xl font-black text-white drop-shadow-lg tracking-wide text-center">กระดานผู้นำ (Top 5)</h2>
                            <button onClick={nextAction} className="btn-3d px-10 py-4 font-black text-2xl md:text-3xl bg-white text-indigo-700 rounded-3xl hover:bg-slate-50 flex items-center w-full md:w-auto justify-center">
                                {isLast ? 'ดูสรุปผล' : 'ข้อต่อไป'} <i className="fa-solid fa-chevron-right ml-3"></i>
                            </button>
                        </div>
                        <div className="flex-1 flex flex-col max-w-5xl w-full mx-auto space-y-4 md:space-y-6">
                            {sortedPlayers.map((p, index) => (
                                <div key={p.uid} className="bg-white/95 backdrop-blur-md rounded-3xl flex items-center p-4 md:p-6 shadow-xl animate-fade-in-up border-2 border-white/30" style={{ animationDelay: `${index * 150}ms` }}>
                                    <div className="font-black w-16 md:w-24 text-center">
                                        {index === 0 ? <span className="text-5xl md:text-6xl animate-bounce drop-shadow-lg inline-block">👑</span> : <span className="text-4xl md:text-5xl text-slate-400">{index + 1}</span>}
                                    </div>
                                    <div className="flex-1 font-black text-3xl md:text-4xl text-slate-800 ml-4 md:ml-6 tracking-wide truncate">{p.name}</div>
                                    <div className="font-black text-3xl md:text-4xl text-indigo-700 bg-indigo-100/80 px-6 py-3 rounded-2xl border border-indigo-200 shadow-inner">
                                        {p.score} <span className="text-xl md:text-2xl opacity-70">pts</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // PODIUM
            if (game.status === 'podium') {
                const sorted = Object.values(game.players || {}).sort((a, b) => b.score - a.score);
                const [first, second, third] = sorted;
                const others = sorted.slice(3);

                return (
                    <div className="flex-1 flex flex-col bg-gradient-to-b from-slate-900 via-indigo-900 to-purple-900 overflow-y-auto relative">
                        <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                            {[...Array(15)].map((_, i) => (
                                <div key={i} className="absolute text-4xl animate-float opacity-80" style={{ left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`, animationDelay: `${Math.random() * 5}s`, animationDuration: `${5 + Math.random() * 5}s` }}>
                                    {['🎉', '🎊', '✨', '⭐', '🏆'][Math.floor(Math.random() * 5)]}
                                </div>
                            ))}
                        </div>

                        <div className="w-full flex flex-col md:flex-row justify-between items-center p-6 md:p-10 z-30 gap-4 mt-4">
                            <h2 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_5px_5px_rgba(0,0,0,1)] tracking-tighter text-center">
                                🏆 สรุปผลการแข่งขัน! 🏆
                            </h2>
                            <button onClick={endAndSave} className="btn-3d bg-white text-indigo-900 px-8 py-4 rounded-full font-black text-xl flex items-center hover:bg-slate-200 shadow-xl">
                                <i className="fa-solid fa-house mr-3"></i> จบเกมและกลับหน้าแรก
                            </button>
                        </div>

                        <div className="flex flex-col items-center z-20 pb-16 px-4 w-full mt-4 md:mt-10">
                            <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8 w-full max-w-5xl relative mt-8">
                                {second && (
                                    <div className="w-full md:w-1/3 order-2 md:order-1 bg-gradient-to-br from-slate-200 to-slate-400 rounded-3xl p-6 shadow-2xl flex flex-col items-center transform md:-translate-y-4 border-4 border-slate-100 animate-fade-in-up" style={{animationDelay: '0.5s'}}>
                                        <div className="w-20 h-20 bg-white/50 rounded-full flex items-center justify-center text-5xl shadow-inner mb-4">🥈</div>
                                        <h3 className="text-3xl font-black text-slate-800 truncate w-full text-center px-2">{second.name}</h3>
                                        <div className="mt-4 bg-slate-800/10 px-6 py-2 rounded-full font-bold text-slate-900 text-xl">{second.score} pts</div>
                                    </div>
                                )}
                                {first && (
                                    <div className="w-full md:w-1/3 order-1 md:order-2 bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-3xl p-8 shadow-[0_0_40px_rgba(250,204,21,0.6)] flex flex-col items-center transform md:-translate-y-12 border-4 border-yellow-100 animate-fade-in-up z-10" style={{animationDelay: '1s'}}>
                                        <div className="absolute -top-10 text-6xl animate-bounce">👑</div>
                                        <div className="w-24 h-24 bg-white/50 rounded-full flex items-center justify-center text-6xl shadow-inner mb-4 mt-2">🥇</div>
                                        <h3 className="text-4xl font-black text-yellow-950 truncate w-full text-center px-2">{first.name}</h3>
                                        <div className="mt-4 bg-yellow-900/10 px-8 py-3 rounded-full font-black text-yellow-950 text-2xl">{first.score} pts</div>
                                    </div>
                                )}
                                {third && (
                                    <div className="w-full md:w-1/3 order-3 md:order-3 bg-gradient-to-br from-orange-400 to-orange-600 rounded-3xl p-6 shadow-2xl flex flex-col items-center transform md:-translate-y-0 border-4 border-orange-200 animate-fade-in-up" style={{animationDelay: '0s'}}>
                                        <div className="w-20 h-20 bg-white/30 rounded-full flex items-center justify-center text-5xl shadow-inner mb-4">🥉</div>
                                        <h3 className="text-3xl font-black text-orange-950 truncate w-full text-center px-2">{third.name}</h3>
                                        <div className="mt-4 bg-orange-900/10 px-6 py-2 rounded-full font-bold text-orange-950 text-xl">{third.score} pts</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }
            return <div></div>;
        }

        function PlayerView({ game, pin, goHome, showError }) {
            const me = game.players[USER_ID];
            const gameTimeLimit = game.timeLimit || 15;
            if (!me) return <div className="p-8 text-center text-xl font-bold flex flex-col items-center justify-center h-full"><i className="fa-solid fa-spinner fa-spin text-5xl mb-4 text-indigo-500"></i>กำลังซิงค์ข้อมูล...</div>;

            const submitAnswer = async (idx) => {
                if(game.status === 'question' && me.lastAnswer === null) {
                    const qStartTime = game.questionStartTime;
                    const correctIdx = game.questions[game.currentQuestionIndex].correctIndex;
                    let newScore = me.score;
                    
                    if(idx === correctIdx) {
                        const timeTaken = (Date.now() - qStartTime) / 1000;
                        const ratio = Math.max(0, Math.min(1, timeTaken / gameTimeLimit));
                        newScore += Math.round((1 - (ratio / 2)) * 1000); 
                        Sounds.correct(); 
                    } else {
                        Sounds.wrong();
                    }

                    // อัปเดตเฉพาะคะแนนของตัวเองไปยังฐานข้อมูล
                    try {
                        await apiCall('submitAnswer', {
                            pin,
                            uid: USER_ID,
                            answer: idx,
                            newScore: newScore
                        });
                        
                        // Fake local state update for instant UI feedback (polling will catch up later)
                        me.lastAnswer = idx;
                    } catch (e) {
                        showError("ส่งคำตอบไม่สำเร็จ: " + e.message);
                    }
                }
            };

            if (game.status === 'lobby') {
                return (
                    <div className="flex-1 bg-gradient-to-b from-emerald-400 to-emerald-600 flex flex-col items-center justify-center p-8 text-white text-center">
                        <div className="bg-white text-emerald-500 p-8 rounded-full shadow-2xl mb-8 animate-bounce"><i className="fa-solid fa-check text-[5rem]"></i></div>
                        <h2 className="text-4xl md:text-5xl font-black mb-8 drop-shadow-lg tracking-wide">เข้าห้องสำเร็จ!</h2>
                        <div className="bg-black/20 px-10 md:px-12 py-8 rounded-[3rem] backdrop-blur-sm mb-12 border border-white/20 w-full max-w-sm">
                            <p className="text-lg md:text-xl font-bold opacity-80 uppercase tracking-widest mb-2">ชื่อของคุณ</p>
                            <p className="text-4xl md:text-5xl font-black truncate">{me.name}</p>
                        </div>
                        <p className="text-2xl md:text-3xl font-bold animate-pulse flex items-center bg-white/10 px-8 py-4 rounded-full border border-white/30">
                            <i className="fa-regular fa-clock mr-4 text-3xl"></i> รอคุณครูเริ่มเกม...
                        </p>
                    </div>
                );
            }

            if (game.status === 'question') {
                if (me.lastAnswer !== null) {
                    return (
                        <div className="flex-1 bg-slate-100 flex flex-col items-center justify-center p-8 text-center">
                            <div className="bg-white p-10 rounded-full shadow-xl mb-8"><i className="fa-solid fa-spinner fa-spin text-[5rem] text-slate-300"></i></div>
                            <h2 className="text-4xl md:text-5xl font-black text-slate-700">ส่งคำตอบแล้ว!</h2>
                            <p className="text-2xl md:text-3xl font-bold text-slate-500 mt-6">เงยหน้าดูผลลัพธ์ที่จอด้านหน้าห้อง</p>
                        </div>
                    );
                }

                return (
                    <div className="flex-1 bg-slate-100 p-4 flex flex-col pb-8 h-[100dvh]">
                        <div className="bg-white py-4 md:py-6 px-6 rounded-[2rem] shadow-sm mb-4 text-center font-black text-xl md:text-2xl text-slate-700">
                            เลือกคำตอบให้ไวที่สุด!
                        </div>
                        <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-4">
                            {COLORS.map((bgClass, idx) => (
                                <button key={idx} onClick={() => submitAnswer(idx)} className={`${bgClass} btn-3d rounded-[2rem] md:rounded-[3rem] flex items-center justify-center border-t-2 border-white/20 active:scale-95 transition-transform w-full h-full min-h-[150px]`}>
                                    <ShapeIcon index={idx} className="w-20 h-20 md:w-32 md:h-32 text-white drop-shadow-lg opacity-90" />
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if (game.status === 'reveal') {
                const currentQ = game.questions[game.currentQuestionIndex];
                const isCorrect = me.lastAnswer === currentQ.correctIndex;
                const bg = isCorrect ? 'bg-emerald-500' : 'bg-rose-500';
                const text = isCorrect ? 'ถูกต้อง!' : 'ผิด!';
                const icon = isCorrect ? 'fa-check' : 'fa-xmark';

                if (me.lastAnswer === null) {
                    return (
                        <div className="flex-1 bg-slate-800 flex flex-col items-center justify-center p-8 text-center text-white">
                            <i className="fa-regular fa-clock text-[8rem] opacity-50 mb-8"></i>
                            <h2 className="text-5xl md:text-6xl font-black">หมดเวลา!</h2>
                            <p className="text-2xl md:text-3xl font-bold mt-4 opacity-80">คุณตอบไม่ทัน</p>
                        </div>
                    );
                }

                return (
                    <div className={`flex-1 ${bg} flex flex-col items-center justify-center p-8 text-center text-white transition-colors duration-500`}>
                        <div className="mb-10 bg-white/20 p-8 rounded-full backdrop-blur-sm border-2 border-white/30 animate-bounce">
                            <i className={`fa-solid ${icon} text-[6rem] drop-shadow-lg`}></i>
                        </div>
                        <h2 className="text-[4rem] md:text-[5rem] font-black drop-shadow-xl mb-12 tracking-wide">{text}</h2>
                        <div className="bg-black/30 px-10 md:px-12 py-8 rounded-[3rem] backdrop-blur-sm border border-white/10 w-full max-w-xs">
                            <p className="text-lg md:text-xl uppercase tracking-widest opacity-80 mb-2 font-bold">คะแนนรวมของคุณ</p>
                            <p className="text-5xl md:text-6xl font-black">{me.score}</p>
                        </div>
                    </div>
                );
            }

            if (game.status === 'leaderboard' || game.status === 'podium') {
                const sorted = Object.values(game.players || {}).sort((a, b) => b.score - a.score);
                const myRank = sorted.findIndex(p => p.name === me.name) + 1; 
                const isWinner = myRank === 1 && game.status === 'podium';

                return (
                    <div className="flex-1 bg-gradient-to-br from-indigo-600 to-purple-800 flex flex-col items-center justify-center p-8 text-center relative overflow-hidden">
                        <div className="absolute inset-0 bg-[radial-gradient(circle,white_2px,transparent_3px)] bg-[size:40px_40px] opacity-10"></div>
                        
                        {isWinner && (
                            <div className="absolute top-10 animate-bounce">
                                <i className="fa-solid fa-crown text-[6rem] text-yellow-400 drop-shadow-lg"></i>
                            </div>
                        )}

                        <h2 className="text-3xl md:text-4xl font-black text-white mb-10 z-10 drop-shadow-md mt-16">
                            {game.status === 'podium' 
                                ? (isWinner ? '🎉 ยินดีด้วย คุณคือผู้ชนะ! 🎉' : 'จบเกมเรียบร้อย!') 
                                : 'สรุปคะแนนของคุณ'}
                        </h2>
                        
                        <div className={`w-full max-w-sm rounded-[3rem] p-10 md:p-12 shadow-2xl relative overflow-hidden z-10 border-b-8 ${isWinner ? 'bg-gradient-to-b from-yellow-50 to-yellow-200 border-yellow-500' : 'bg-white border-indigo-400'}`}>
                            <div className={`absolute top-0 left-0 w-full h-8 ${isWinner ? 'bg-gradient-to-r from-yellow-400 to-amber-500' : 'bg-gradient-to-r from-yellow-300 to-yellow-500'}`}></div>
                            <p className={`${isWinner ? 'text-amber-700' : 'text-slate-400'} font-bold mb-2 uppercase tracking-widest text-base md:text-lg mt-4`}>อันดับที่</p>
                            <p className={`text-[5rem] md:text-[6rem] font-black mb-8 leading-none drop-shadow-sm ${isWinner ? 'text-amber-600' : 'text-indigo-700'}`}>{myRank || '-'}</p>
                            <div className={`w-full h-1 mb-8 rounded-full ${isWinner ? 'bg-amber-200' : 'bg-slate-200'}`}></div>
                            <p className={`${isWinner ? 'text-amber-700' : 'text-slate-400'} font-bold mb-2 uppercase tracking-widest text-base md:text-lg`}>คะแนนรวม</p>
                            <p className={`text-4xl md:text-5xl font-black ${isWinner ? 'text-amber-900' : 'text-slate-800'}`}>{me.score}</p>
                        </div>

                        {game.status === 'podium' && (
                            <button onClick={goHome} className="mt-12 px-10 py-4 text-xl md:text-2xl bg-white/20 hover:bg-white/30 text-white border-2 border-white/30 rounded-3xl font-black backdrop-blur-sm z-10 transition-colors shadow-lg">
                                กลับสู่หน้าแรก
                            </button>
                        )}
                    </div>
                );
            }
            return <div className="p-8">รอระบบ...</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
